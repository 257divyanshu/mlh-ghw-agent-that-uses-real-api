<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Travel Agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>


<body>

  <div class="page-glow page-glow-left"></div>
  <div class="page-glow page-glow-right"></div>

  <div class="app-shell">

    <header class="app-header">

      <div class="brand-mark">✈️</div>

      <div>
        <p class="eyebrow">AI Travel Assistant</p>
        <h1>Smart Travel Agent</h1>
        <p class="subtitle">Gemini + Real APIs + Agent Loop</p>
      </div>

    </header>


    <div class="chat-card">

      <div id="messages" class="conversation"></div>

      <div class="composer-panel">

        <p class="suggestions-label">Try asking</p>

        <div class="suggestion-list">
          <button class="suggestion" data-prompt="What's the weather in London?">🌧️ Weather in London</button>
          <button class="suggestion" data-prompt="Tell me about Japan.">🌍 Tell me about Japan</button>
          <button class="suggestion" data-prompt="Convert 100 USD to INR.">💱 100 USD to INR</button>
        </div>

        <div class="composer">

          <span class="visually-hidden">
            <label for="message">Your message</label>
          </span>

          <textarea
            id="message"
            placeholder="Ask me about travel..."
            autocomplete="off"
            rows="1"
          ></textarea>

          <button id="send-btn" class="submit-button">
            <span class="button-label">Send</span>
            <span class="button-arrow">↑</span>
          </button>

        </div>

        <p class="keyboard-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>

      </div>

    </div>

    <footer>Smart Travel Agent · Powered by Gemini</footer>

  </div>

  <script src="/app.js"></script>

</body>
</html>
