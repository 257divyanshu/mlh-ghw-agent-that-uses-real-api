<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Travel Agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>


<body>

  <main class="container">

    <header>

      <h1>✈️ Smart Travel Agent</h1>

      <p>
        Gemini + Real APIs + Agent Loop
      </p>

    </header>

    <div id="messages" class="messages"></div>


    <form id="chat-form">

      <input
        id="message"
        type="text"
        placeholder="Ask me about travel..."
        autocomplete="off"
      />

      <button type="submit">
        Send
      </button>

    </form>

  </main>

  <script src="/app.js"></script>

</body>
</html>
